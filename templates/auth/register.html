{% extends "base.html" %}

{% block title %}Registrace - Ptačí Dashboard{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>📝 Registrace</h1>
    
    <form method="POST">
        <div class="form-group">
            <label for="name">Jméno:</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>

        <div class="form-group">
            <label for="password">Heslo:</label>
            <input type="password" id="password" name="password" required>
            <small style="color: #666; display: block; margin-top: 5px;">Minimum 6 znaků</small>
        </div>

        <div class="form-group">
            <label for="password_confirm">Potvrzení hesla:</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
        </div>

        <div class="form-group">
            <button type="submit">Zaregistrovat se</button>
        </div>
    </form>

    <div class="auth-link">
        Již máte účet? <a href="{{ url_for('login') }}">Přihlaste se zde</a>
    </div>
</div>
{% endblock %}
